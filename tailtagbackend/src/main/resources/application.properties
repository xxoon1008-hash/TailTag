spring.application.name=tailtag-backend

# PostgreSQL 연결 설정 (로컬 기본값 - Render 환경변수가 자동으로 덮어씀)
spring.datasource.url=jdbc:postgresql://localhost:5432/tailtag
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 서버 포트
server.port=${PORT:8080}

# JWT 설정
jwt.secret=${JWT_SECRET:tailtag-super-secret-key-change-this-in-production-2026}
jwt.expiration=86400000
