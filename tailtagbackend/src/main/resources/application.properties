spring.application.name=tailtag-backend

# PostgreSQL 연결 설정 (Render: DATABASE_URL = "postgresql://..." 형태로 제공)
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/tailtag}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 서버 포트
server.port=${PORT:8080}

# JWT 설정
jwt.secret=${JWT_SECRET:tailtag-super-secret-key-change-this-in-production-2026}
jwt.expiration=86400000
