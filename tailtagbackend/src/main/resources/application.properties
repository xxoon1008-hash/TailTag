spring.application.name=tailtag-backend

# MySQL 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/tailtag?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 서버 포트 (기본 8080)
server.port=8080

# JWT 설정 (다음 단계에서 사용할 값 미리 준비)
jwt.secret=tailtag-super-secret-key-change-this-in-production-2026
jwt.expiration=86400000
